<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>lyt个人主页</title>
        <style>
            header {
                text-align:center;
            }
            h1 {
                color: blue;
                font-size: 3rem;
            }
            #avatar {
                border-radius: 50%;
                box-shadow: 10px 10px 3px gray;
                opacity: 0.8;
                transition: 1s;
                width:125px;
                height:125px;
            }
            #avatar:hover {
                transform: scale(1.2);
            }
            nav {
                display: flex;
                flex-direction: row;
                height: 50px;
                justify-content:center;
                gap:10px;
                align-items: center;
                font-size:15px;
                padding:10px;
            }
            nav a {
                color: black;
            }
            nav a:hover {
                color: red;
            }
            section{
                margin:30px 0;
            }
            input {
                border: 2px solid gray;
            }
            input:focus {
                background-color: yellow;
                border: 2px solid blue;
                outline: none;
            }
            button {
                transition: 1s;
            }
            button:hover {
                background-color: yellow;
                transform: scale(1.1);
            }
            button:active {
                background-color: blue;
            }
            h3::before {
                content: "⭐";
                display: inline-block;
                margin-right: 2px;
            }
            @media (max-width: 600px) {
                h1 {
                    font-size: 30px;
                }
                nav {
                    flex-direction: column;
                }
                #avatar{
                    width:75px;
                    height:75px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>我的个人主页</h1>
            <img id="avatar" src="./images/363659.jpg" alt="我的头像">
        </header>
        <nav>
            <a href="#about">关于我</a>
            <a href="#goal">我的目标</a>
            <a href="#skill">我的技能</a>
        </nav>
        <main>
            <section>
                <h2 id="about">关于我</h2>
                <div>
                    <p>
                        我是一名大学生。<br>
                        我正在学习 <span>Web 开发</span>。
                    </p>
                    <p>我喜欢算法竞赛。</p>
                    <h3>我的兴趣</h3>
                    <ul>
                        <li class="interesting">算法竞赛</li>
                        <li class="interesting">Web开发</li>
                        <li class="interesting">编程</li>
                    </ul>
                    <h3>我的学习计划</h3>
                    <ol>
                        <li>学习HTML</li>
                        <li>学习CSS</li>
                        <li>学习JavaScript</li>
                    </ol>
                    <a href="https://github.com/LYT01222">我的 Github</a>
                    <br>
                </div>
            </section>
            <section>
                <h2 id="goal">我的目标</h2>
                <p>希望能够加入 Web 相关的团队。</p>
            </section>
            <section>
                <h2 id="skill">我的技能</h2>
                <table>
                    <tr>
                        <th colspan="2">我的技能</th>
                    </tr>
                    <tr>
                        <th>技能</th>
                        <th>掌握情况</th>
                    </tr>
                    <tr>
                        <td>C++</td>
                        <td>熟练</td>
                    </tr>
                    <tr>
                        <td>Git</td>
                        <td>会初步运用</td>
                    </tr>
                    <tr>
                        <td>HTML</td>
                        <td>正在学习</td>
                    </tr>
                    <tr>
                        <td>CSS</td>
                        <td>还未学习</td>
                    </tr>
                    <tr>
                        <td>JavaScript</td>
                        <td>还未学习</td>
                    </tr>
                </table>
            </section>
        </main>
        <form>
            <label for="name">你的名字：</label>
            <input id="name" type="text">
            <label for="message">你的留言：</label>
            <input id="message" type="text">
            <button>提交</button>
        </form>
        <p id="name-result"></p>
        <div id="messages"></div>
        <form>
            <label for="age">你的年龄：</label>
            <input id="age" type="number">
            <button>提交</button>
        </form>
        <form>
            <label for="password">你的密码：</label>
            <input id="password" type="password">
            <button>提交</button>
        </form>
        <footer>
            <p>© 2026 LYT</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
